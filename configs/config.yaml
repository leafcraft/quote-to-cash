# quote-to-cash — Quote-to-Cash Pod
#
# A pod of five digital employees + five human roles that runs a deal from
# an RFQ all the way to CASH: RFQ -> shape a priced, policy-compliant deal
# (super-agent) -> approval matrix (rep / deal-desk / finance / CFO) ->
# draft -> ISSUE the quote artifact (finisher, fail-closed) -> invoice ->
# dun the overdue backlog.
#
# The pod is a TEAM, not a pipeline. Every wire is conditional; every
# hand-off is a finished contract; nothing is approved or issued on
# silence; the finisher produces the real artifact and fails closed; the
# WORM sink is the terminus. Systems (CPQ / ERP / CLM / billing) are TOOLS
# inside agents, never members.
#
# The amount x margin x discount approval matrix is declared as wire
# conditions on cass_shaper_agent — read that block to see the whole
# approval policy in one place.
#
# Design doctrine: .claude/skills/leafmesh/building-agents-thoroughly.md
# Field reference:  .claude/skills/leafmesh/agent-config-fields.md

name: "quote-to-cash"
version: "1.0.0"
architecture: "managed_mesh"
environment: "development"
debug: true
log_level: "INFO"

auto_discover:
  directory: "./agency"
  pattern: "*_agent.py"
  recursive: false

# The Manager is the SUPERVISOR. It escalates to the RevOps Lead when an
# agent fails with an error that a retry cannot fix (auth, bad request,
# credit, bad config), when 5 different agents fail in one session, or when
# restarts run out. A broken hand-off contract only raises an alert. It does
# not chase an unanswered approval. It is not a router in the middle of the team.
manager:
  model: "gpt-4o-mini"
  domain: "generic"
  prompt: |
    This mesh runs quote-to-cash. A deal flows RFQ -> Cass (shape a priced,
    policy-compliant deal) -> the approval matrix on Cass's wires routes it
    to exactly ONE human tier (rep / deal-desk / finance / CFO) -> the
    drafter assembles the quote -> the issuer renders + issues the artifact,
    failing closed on any under-approved deal -> billing invoices accepted
    quotes and duns the overdue backlog. A deal still incomplete after its
    rework bound and a severely overdue account (45+ days) go to the RevOps
    Lead on the agents' own wires; a below-floor margin or a deep discount
    goes to the CFO tier on Cass's matrix. Nothing is approved or issued on
    silence.
  routing:
    mode: static
  escalation:
    targets:
      - type: human_agent
        agent: revops_lead_human
    auto_escalate:
      max_retries: 3
      max_errors_per_session: 5

# 2.4.131 runtime block — deal shaping (super-agent, many SKUs + competitive
# signals) and Claude drafting can run long. Everything else stays default
# (omission is meaningful; we do not pre-fill defaults). The `timeouts` block
# is rejected by <=2.4.130, so it lands WITH the 2.4.131 floor.
timeouts:
  mesh_call_default_timeout_s: 150
  llm_hard_timeout_s: 300

# ── Entry points — one per real-world trigger ────────────────────────────────
entry_points:
  - name: "rfq_email"
    target: "quinn_coordinator_agent"
    description: "An RFQ arrives by email — Quinn opens the deal."
    condition: always
  - name: "cpq_event"
    target: "quinn_coordinator_agent"
    description: "A CPQ/CRM system event starts a deal."
    condition: always
  - name: "rep_initiated"
    target: "quinn_coordinator_agent"
    description: "A sales rep starts an RFQ by hand."
    condition: always
  - name: "deal_status"
    target: "quinn_coordinator_agent"
    description: "Anyone asks 'where is my quote?' — Quinn answers from the case record."
    condition: always
  - name: "quote_accepted"
    target: "billing_agent"
    description: "The customer accepted a quote — raise the invoice (billing, invoice mode)."
    condition: always
  - name: "dunning_sweep"
    target: "billing_agent"
    description: "Scheduled/manual sweep of overdue invoices (billing, dun mode)."
    condition: always
  # ── HITL resume — a human answers in Studio's Inbox ──
  - name: "rep_reply"
    target: "sales_rep_human"
    description: "HITL resume — the sales rep approves / rejects / resubmits."
    condition: always
  - name: "deal_desk_reply"
    target: "deal_desk_human"
    description: "HITL resume — deal desk decides."
    condition: always
  - name: "finance_reply"
    target: "finance_approver_human"
    description: "HITL resume — finance decides."
    condition: always
  - name: "cfo_reply"
    target: "cfo_human"
    description: "HITL resume — CFO decides."
    condition: always
  - name: "revops_reply"
    target: "revops_lead_human"
    description: "HITL resume — the RevOps Lead resolves an escalation."
    condition: always

agents:

  # ─────────────────────────────────────────────────────────────────────────
  # Quinn — Deal Coordinator (AI). Owns the deal end to end: opens the case,
  # orchestrates the pod, keeps live status, is the single point of contact.
  # Pure orchestration — never prices, never approves, never issues. (Pure
  # YAML — no agency/quinn_coordinator_agent.py; runs as a plain LLM agent.)
  # ─────────────────────────────────────────────────────────────────────────
  quinn_coordinator_agent:
    name: "quinn_coordinator_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1000
    description: "Deal Coordinator — opens the case, orchestrates, keeps status, single point of contact."
    prompt: |
      You are Quinn, the Deal Coordinator. You OWN each deal from the moment
      an RFQ arrives to the moment it is cash. You orchestrate the pod and
      keep everyone informed — you never price a deal, draft a quote, or
      approve anything yourself.

      On a new RFQ: open the case, echo the RFQ fields unchanged, and hand it
      to Cass to shape. On a status ask: answer the current stage / waiting-on
      / next gate from the case record — nothing invented. Route anything that
      needs a human owner's judgement (a stuck deal, a policy question) to the
      RevOps Lead; never make the pricing or policy call yourself.

      Set "action" to one of: open_case | status | escalate. Echo rfq_id,
      customer_id, line_items, target_close, segment from the input unchanged
      (use "" / [] when a field is missing).

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": "", "rfq_id": "", "customer_id": "", "line_items": [], "target_close": "", "segment": "", "stage": "", "waiting_on": "", "summary": ""}
    yields:
      action: "string"          # open_case | status | escalate
      rfq_id: "string"
      customer_id: "string"
      line_items: {type: array, items: object}   # {sku, qty, list_price_cents} — echoed unchanged
      target_close: "string"
      segment: "string"
      stage: "string"
      waiting_on: "string"
      summary: "string"
    inputs:
      payload: "object"
    can_call:
      - agent: "cass_shaper_agent"
        condition: "calling_agent_response.action == 'open_case'"
      - agent: "revops_lead_human"
        condition: "calling_agent_response.action == 'escalate'"

  # ─────────────────────────────────────────────────────────────────────────
  # Cass — Costing & Deal Shaper (AI, SUPER-AGENT). Turns a raw RFQ into a
  # priced, policy-compliant deal: plans the pricing across the SKUs, pulls the
  # price book / deal history / competitor signals through its tools, and
  # shapes a discount within policy. super_agent = autonomous plan/execute/
  # verify across many SKUs + competitive signals. @chain = the pricing +
  # completeness floors (fail closed). Its outbound wires ARE the approval
  # matrix (amount x margin x discount -> rep / deal-desk / finance / CFO).
  # Backed by agency/cass_shaper_agent.py.
  # ─────────────────────────────────────────────────────────────────────────
  cass_shaper_agent:
    name: "cass_shaper_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "claude-sonnet-4-6"
    temperature: 0.1
    max_tool_calls_per_message: 15   # a deal has many SKUs + signals; default 5 truncates silently
    description: "Costing & Deal Shaper — costs the RFQ, shapes a policy-compliant discount; a code floor recomputes the basis the approval matrix routes on."
    super_agent:                     # DICT form = the tuning path (2.4.123+); the ONLY way to tune it
      cost_ceiling: 100000
      wall_clock: 900
    prompt: |
      You are Cass, the Costing & Deal Shaper. Your job is to turn a raw RFQ
      into a priced, policy-compliant deal — and to REFUSE to guess a cost
      basis. Pull the price book for every SKU, this customer's deal history,
      and competitor pricing through your tools BEFORE you price anything.
      Then shape a discount that is defensible against the competitive picture
      and the account's history — within policy.

      NEVER invent a cost or list price no price book shows. An RFQ with no
      customer or no line-items is INCOMPLETE — say so honestly; a code floor
      routes it back to the rep for rework. Load the `quote` playbook for the
      read-before-price order and the `approve` playbook to read which tier
      the deal will route to.

      NOTE: a deterministic code floor RECOMPUTES total_cogs / total_list /
      margin from the price book x line-items, CLAMPS discount to 0..1,
      DERIVES the tier from the policy bands, and recomputes gross_margin_pct
      as the POST-DISCOUNT margin — these drive the approval matrix, so you
      cannot move a deal below its sign-off tier. Price honestly.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"rfq_id": "", "customer_id": "", "segment": "", "line_items": [], "discount_pct": 0, "rationale": "", "deal_desk_briefing": "", "total_cogs_cents": 0, "total_list_cents": 0, "gross_margin_pct": 0, "tier": "", "has_regulated_sku": false, "is_complete": false, "missing_fields": [], "intake_status": "incomplete", "rework_round": 0, "rework_exhausted": false, "pricing_floor_applied": false}
    yields:
      rfq_id: "string"
      customer_id: "string"
      segment: "string"
      line_items: {type: array, items: object}   # {sku, qty, list_price_cents} — re-priced from the price book by the floor
      discount_pct: "number"          # clamped 0..1 by the @chain floor
      rationale: "string"
      deal_desk_briefing: "string"
      total_cogs_cents: "number"      # recomputed from the price book (floor)
      total_list_cents: "number"      # recomputed from the price book (floor) — drives the matrix
      gross_margin_pct: "number"      # POST-DISCOUNT margin (floor) — drives the matrix
      tier: "string"                  # derived from the policy bands (floor)
      has_regulated_sku: "boolean"    # set from the price book (floor)
      is_complete: "boolean"          # FORCED by the completeness floor — gates routing below
      missing_fields: {type: array, items: string}   # which required fields are absent (floor)
      intake_status: "string"         # complete | incomplete (floor)
      rework_round: "number"          # bounded back-edge counter (floor)
      rework_exhausted: "boolean"     # rework bound hit -> terminal route (floor)
      pricing_floor_applied: "boolean"
    inputs:
      payload: "object"
      line_items: "list"
    # Playbook — the CRAFT, fetched on demand. Only `description` rides in the
    # prompt; `responsibility` is loaded when the model recognises the intent.
    playbook:
      - intent: quote
        description: "How to shape and price a compliant quote from an RFQ."
        responsibility: |
          1. Pull the price book for EVERY SKU FIRST (read_price_book), then
             the customer's deal history (read_deal_history) and competitor
             signals (read_competitor_prices) — you cannot price a deal you
             have not fully costed, and you cannot justify a discount without
             the competitive picture.
          2. Compute the list total and the cost basis from the price book,
             not from numbers in the RFQ text. Choose a discount that answers
             the strongest real competitive threat and respects the account's
             prior discounts — never a round number for its own sake.
          3. If a SKU is regulated, flag it — regulated components change the
             sign-off path.
          4. An RFQ with no customer or no line-items is INCOMPLETE. Say so;
             do not price a headless RFQ.
        variables: [rfq_id]
      - intent: approve
        description: "How to prepare the approval brief and read the tier the deal routes to."
        responsibility: |
          1. The deal routes to exactly ONE tier by amount x margin x
             discount: rep (small, healthy, <=10% off), deal desk (>10% off or
             >$25K), finance (>20% off or >$100K), CFO (below margin floor or
             >30% off or >$1M). Write the deal_desk_briefing to LEAD with the
             discount + tier and cite the single strongest reason.
          2. Recommend approve vs negotiate-down. State plainly when the tier
             is CFO ("CFO approval required.") vs within deal-desk authority.
          3. Never soften a below-floor margin to dodge a tier — the code
             floor recomputes it anyway and the gate fires on the computed
             number.
        variables: [rfq_id, tier]
    # Day-0 tool surface — reads the seed price book / history / competitor
    # store so the pod runs with NO connector wired. Each tool announces
    # itself (available:false) when it has no real source. See agency/tools.py.
    tools: [read_price_book, read_deal_history, read_competitor_prices]
    tool_categories: [shaping]
    # ── To wire a real CPQ/ERP price book: create the vault connection
    #    'cpq_mcp' on Infrastructure → Integrations → MCP (the MCP server's
    #    URL + token live there, never here), then uncomment — here before the
    #    first start, in Studio's YAML editor after it (applies live, no restart).
    #    Each named action under `use:` becomes its own tool, e.g. cpq_read_price_book. ──
    # mcp:
    #   - connection: cpq_mcp   # vault connection holds the URL + token
    #     transport: http
    #     use: [read_price_book, read_deal_history, read_competitor_prices]
    #     name: cpq
    #     timeout: 30
    can_call:
      # ══ APPROVAL MATRIX (amount x margin x discount) ══════════════════════
      # Thresholds (cents): rep <= $25K (2_500_000) < deal_desk <= $100K
      # (10_000_000) < finance <= $1M (100_000_000) < CFO. Margin floor 20%
      # (0.20); discount bands 10% / 20% / 30%. Every matrix wire also requires
      # is_complete == true, so an incomplete RFQ never reaches an approver.
      # The four tiers are mutually exclusive + exhaustive — exactly one fires.
      # ══════════════════════════════════════════════════════════════════════

      # CFO — margin below the 20% floor OR discount > 30% OR list > $1M
      - agent: "cfo_human"
        condition: "calling_agent_response.is_complete == true and (calling_agent_response.gross_margin_pct < 0.20 or calling_agent_response.discount_pct > 0.30 or calling_agent_response.total_list_cents > 100000000)"

      # Finance — discount > 20% OR list > $100K (and not CFO-bound)
      - agent: "finance_approver_human"
        condition: "calling_agent_response.is_complete == true and calling_agent_response.gross_margin_pct >= 0.20 and calling_agent_response.discount_pct <= 0.30 and calling_agent_response.total_list_cents <= 100000000 and (calling_agent_response.discount_pct > 0.20 or calling_agent_response.total_list_cents > 10000000)"

      # Deal desk — discount > 10% OR list > $25K (and not finance/CFO-bound)
      - agent: "deal_desk_human"
        condition: "calling_agent_response.is_complete == true and calling_agent_response.gross_margin_pct >= 0.20 and calling_agent_response.discount_pct <= 0.20 and calling_agent_response.total_list_cents <= 10000000 and (calling_agent_response.discount_pct > 0.10 or calling_agent_response.total_list_cents > 2500000)"

      # Rep self-approval — small, healthy-margin, low-discount deals
      - agent: "sales_rep_human"
        condition: "calling_agent_response.is_complete == true and calling_agent_response.gross_margin_pct >= 0.20 and calling_agent_response.discount_pct <= 0.10 and calling_agent_response.total_list_cents <= 2500000"

      # ══ BOUNDED REWORK BACK-EDGE ══════════════════════════════════════════
      # Incomplete RFQ -> back to the rep to fix (rework). The counter in the
      # floor bounds it: once rework_exhausted is true, the deal goes TERMINAL
      # to the RevOps Lead instead of looping rep<->shaper forever.
      - agent: "sales_rep_human"
        condition: "calling_agent_response.is_complete == false and calling_agent_response.rework_exhausted == false"
      - agent: "revops_lead_human"
        condition: "calling_agent_response.rework_exhausted == true"

  # ─────────────────────────────────────────────────────────────────────────
  # Drafter — Quote Drafter (AI). Runs AFTER a human tier approves: assembles
  # the quote body (pricing table, terms, validity, next steps) and renders a
  # DRAFT to ./out, then hands to the issuer. Deliberately SEPARATE from the
  # issuer (the writer is not the actuator). @chain caps validity by tier (a
  # deeper discount gets a shorter shelf life) — fail closed. Backed by
  # agency/drafter_agent.py.
  # ─────────────────────────────────────────────────────────────────────────
  drafter_agent:
    name: "drafter_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1500
    description: "Quote Drafter — assembles the approved quote body + validity and renders a draft to ./out; a code floor caps validity by tier."
    prompt: |
      You are the Quote Drafter. A deal has been APPROVED. Assemble the quote
      body — a pricing table, terms, validity window, and next steps. Never
      auto-send; the issuer produces the issued artifact.

      NOTE: a deterministic code floor CAPS validity_days by the deal's
      discount tier (deeper discounts get a shorter shelf life) and renders
      the draft to ./out — so don't grant a long validity to a steep discount.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"quote_body": "", "validity_days": 0, "tier": "", "rfq_id": "", "customer_id": "", "drafted": false, "artifact_path": "", "validity_floor_applied": false}
    yields:
      quote_body: "string"
      validity_days: "number"          # capped by tier by the @chain floor
      tier: "string"
      rfq_id: "string"
      customer_id: "string"
      drafted: "boolean"               # set by the floor once the draft renders
      artifact_path: "string"          # ./out/<rfq>_quote_draft.md
      validity_floor_applied: "boolean"
    inputs:
      upstream_yields: "object"
    can_call:
      # The drafter assembles the body; the ISSUER renders + issues the real
      # quote artifact from the approved pricing (finisher, fail-closed).
      - agent: "quote_issuer_agent"
        condition: "calling_agent_response.drafted == true"

  # ─────────────────────────────────────────────────────────────────────────
  # quote_issuer_agent — the ARTIFACT-PRODUCING EXECUTOR (FINISHER). Runs after
  # the deal is approved + drafted and GENERATES + ISSUES the quote as a real
  # artifact to ./out/<quote>.pdf (ReportLab if present, else a deterministic
  # .md — always a real file, day-0, no extra deps), plus a CPQ push to the
  # vault record 'cpq_webhook' (Infrastructure → Add custom → 'Outbound
  # webhook'; until it exists a dev-store fallback records the issued quote
  # and cpq_pushed is false). The push happens only after the approval check
  # passes. Backed by agency/quote_issuer_agent.py:
  #   @chain enforce_issuance_floor — FAIL CLOSED: never issues a quote that
  #     wasn't approved, or whose discount TIER wasn't cleared by the REQUIRED
  #     approver — re-derived IN CODE from the financials (the same matrix
  #     Cass's wires encode) and compared with the seat that actually approved
  #     (recorded by the drafter from the reply). On a trip nothing is
  #     rendered or pushed, any artifact is DELETED and the result marked
  #     blocked. The WORM sink still records the attempt.
  # ─────────────────────────────────────────────────────────────────────────
  quote_issuer_agent:
    name: "quote_issuer_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Artifact-producing executor — renders + issues the approved quote to ./out/<quote>.pdf (or .md); a fail-closed floor blocks any unapproved / under-approved quote and deletes the partial."
    # CPQ push is a custom actuator inside the agent body: it reads the vault
    # record 'cpq_webhook' with leafmesh.connection_rows (base URL + header /
    # secret rows). No address or token in .env or in this file. Not notify:
    # the push's reply sets cpq_pushed and the dev-store fallback.
    yields:
      quote_id: "string"
      artifact_path: "string"          # ./out/<quote_id>.pdf or .md — the real artifact
      artifact_kind: "string"          # pdf | markdown | none
      issued: "boolean"                # FORCED by the @chain fail-closed floor
      status: "string"                 # issued | issuance_blocked | no_deal_context
      block_reasons: {type: array, items: string}   # why issuance was blocked (floor)
      approved: "boolean"
      approved_by: "string"            # which approver cleared the tier
      required_approver: "string"      # re-derived from the financials (floor basis)
      rfq_id: "string"
      customer_id: "string"
      tier: "string"
      total_cents: "number"
      valid_until: "string"
      issue_summary: "string"
      cpq_pushed: "boolean"
    inputs:
      upstream_yields: "object"
    can_call:
      - agent: "qtc_audit_logger_agent"
        condition: always

  # ─────────────────────────────────────────────────────────────────────────
  # billing_agent — AR & Collections Clerk (AI). The CASH side. One role, two
  # crafts loaded from the playbook on demand: `invoice` (raise an invoice from
  # an accepted quote) and `dun` (chase an overdue invoice on cadence).
  # `scaling.copies.count: 3` fans the sweep across parallel copies; each calls the atomic
  # claim_billing_work tool and gets a DISJOINT slice, so copies split the
  # backlog instead of all chasing the same invoices. @chain never duns a PAID
  # invoice (fail closed) and records verified actions. Backed by
  # agency/billing_agent.py.
  # ─────────────────────────────────────────────────────────────────────────
  billing_agent:
    name: "billing_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tool_calls_per_message: 10   # claim + read across a backlog; default 5 truncates silently
    description: "AR & Collections Clerk — invoices accepted quotes and duns the overdue backlog; parallel copies fan out with an atomic claim; a code floor never duns a paid invoice."
    scaling:                      # 2.4.484 (was instances / instances_handoff)
      copies:
        mode: fixed
        count: 3                     # parallel copies per activation (backlog fan-out)
        handoff: last          # COMBINE the copies' results and route once
    # Scheduled dunning sweep — daily, in the company's timezone (NOT UTC).
    # Also reachable via the dunning_sweep entry point. ONE cron line — with
    # copies.count: 3 that is 3 copies per sweep (not 9); a list would multiply.
    wake_up: "0 9 * * *"
    timezone: "Asia/Kolkata"
    wake_up_input:
      trigger: dunning_sweep
      mode: dun
    prompt: |
      You are the AR & Collections Clerk. You run in ONE of two modes per
      activation — set "mode" to the one you worked in:
        · invoice — a customer accepted a quote; raise the invoice.
        · dun     — a scheduled sweep of the overdue backlog; chase them.

      FIRST claim your work atomically with claim_billing_work(kind, count) so
      you and your parallel copies never touch the same invoice — put every
      invoice_id you claimed into "worked". Read details with
      read_open_invoices. Load the `invoice` or `dun` playbook for the cadence.

      NOTE: a deterministic code floor re-checks every claimed invoice against
      the billing system and will NEVER dun one that is already paid; it
      records each verified action and raises an escalation for anything
      severely overdue. Report honestly what you claimed — do not invent an
      invoice the claim did not return.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"mode": "", "worked": [], "escalations": [], "dunned_count": 0, "invoiced_count": 0, "available": false, "summary": "", "claim_token": ""}
    yields:
      mode: "string"                 # invoice | dun
      worked: {type: array, items: string}        # invoice_ids this worker verified + acted on
      escalations: {type: array, items: string}   # invoice_ids needing the RevOps Lead (list -> concatenates on merge)
      dunned_count: "number"
      invoiced_count: "number"
      available: "boolean"           # honest dev-store availability
      summary: "string"
      claim_token: "string"
    inputs:
      trigger: "string"
      mode: "string"
    playbook:
      - intent: invoice
        description: "How to raise an invoice from an accepted quote."
        responsibility: |
          1. Claim the accepted-quote work (claim_billing_work kind=invoice) —
             exactly one copy wins a single accepted quote; the rest get none.
          2. Build the invoice from the accepted quote's terms (net 30 from
             issue). Record it; do not mark anything paid.
          3. If nothing was claimed, say so honestly (available:false) — never
             report an invoice you did not raise.
      - intent: dun
        description: "How to chase an overdue invoice on cadence."
        responsibility: |
          1. Claim a DISJOINT batch of overdue invoices (claim_billing_work
             kind=dun, count) so copies split the backlog.
          2. For each, advance the dunning stage by one and send the
             stage-appropriate reminder. Never chase a paid invoice — the code
             floor enforces this, but do not attempt it.
          3. Anything severely overdue (45+ days) or past the final dunning
             stage goes to the RevOps Lead — put it in "escalations".
    tools: [read_open_invoices, claim_billing_work]
    tool_categories: [billing]
    # ── To wire a real billing/AR system: create the vault connection
    #    'billing_mcp' on Infrastructure → Integrations → MCP (URL + token live
    #    there), then uncomment — here before the first start, in Studio's YAML
    #    editor after it (applies live, no restart). ──
    # mcp:
    #   - connection: billing_mcp   # vault connection holds the URL + token
    #     transport: http
    #     use: [read_open_invoices, raise_invoice, record_payment]
    #     name: billing
    #     timeout: 30
    can_call:
      - agent: "revops_lead_human"
        condition: "calling_agent_response.escalations != []"
      - agent: "qtc_audit_logger_agent"
        condition: "calling_agent_response.worked != []"

  # ─────────────────────────────────────────────────────────────────────────
  # Human members — first-class, answering in Studio's Inbox.
  # Nothing is approved or issued on silence. If nobody answers within the
  # seat's human_timeout_seconds, the request waits no longer: its Inbox card
  # closes and the ticket records that no reply came. Nobody is chased
  # automatically. fallback_on_timeout / fallback_response below declare the
  # intent (held_for_review -> audit); on leafmesh 2.4.486 a dual seat's
  # timeout does not route it yet.
  # `dual` belongs on the human/webhook boundary agent only; downstream peers
  # are `chain` (a dual->dual can_call is unbounded ping-pong, nuance #17).
  # ─────────────────────────────────────────────────────────────────────────

  sales_rep_human:
    name: "sales_rep_human"
    agent_type: "human"
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 14400     # 4 working hours to self-approve a small deal or fix an incomplete RFQ
    description: "Sales Rep — self-approves small healthy deals; reworks incomplete RFQs."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    yields:
      human_message: "string"        # approve | reject | resubmit | hold | held_for_review
    inputs:
      rfq_id: "string"
    can_call:
      - agent: "drafter_agent"
        condition: "calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'Approve' or calling_agent_response.human_message == 'approved' or calling_agent_response.human_message == 'Approved'"
      - agent: "cass_shaper_agent"
        condition: "calling_agent_response.human_message == 'resubmit'"
      - agent: "qtc_audit_logger_agent"
        condition: "calling_agent_response.human_message == 'reject' or calling_agent_response.human_message == 'rejected' or calling_agent_response.human_message == 'hold' or calling_agent_response.human_message == 'held_for_review'"

  deal_desk_human:
    name: "deal_desk_human"
    agent_type: "human"
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 14400     # 4 working hours — the deal desk's same-day turnaround
    description: "Deal Desk — discounted + competitive deals (>10% off or >$25K list, up to 20% / $100K)."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    yields:
      human_message: "string"        # approve | reject | hold | held_for_review
    inputs:
      rfq_id: "string"
    can_call:
      - agent: "drafter_agent"
        condition: "calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'Approve' or calling_agent_response.human_message == 'approved' or calling_agent_response.human_message == 'Approved'"
      - agent: "qtc_audit_logger_agent"
        condition: "calling_agent_response.human_message == 'reject' or calling_agent_response.human_message == 'rejected' or calling_agent_response.human_message == 'hold' or calling_agent_response.human_message == 'held_for_review'"

  finance_approver_human:
    name: "finance_approver_human"
    agent_type: "human"
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 28800     # 8 working hours — one business day
    description: "Finance Approver — large or deep-discount deals (>20% off or >$100K list, up to 30% / $1M)."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    yields:
      human_message: "string"        # approve | reject | hold | held_for_review
    inputs:
      rfq_id: "string"
    can_call:
      - agent: "drafter_agent"
        condition: "calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'Approve' or calling_agent_response.human_message == 'approved' or calling_agent_response.human_message == 'Approved'"
      - agent: "qtc_audit_logger_agent"
        condition: "calling_agent_response.human_message == 'reject' or calling_agent_response.human_message == 'rejected' or calling_agent_response.human_message == 'hold' or calling_agent_response.human_message == 'held_for_review'"

  cfo_human:
    name: "cfo_human"
    agent_type: "human"
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 86400     # 24 hours — next business day
    description: "CFO — top-tier authority (margin below 20%, discount over 30%, or list over $1M)."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    yields:
      human_message: "string"        # approve | reject | hold | held_for_review
    inputs:
      rfq_id: "string"
    can_call:
      - agent: "drafter_agent"
        condition: "calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'Approve' or calling_agent_response.human_message == 'approved' or calling_agent_response.human_message == 'Approved'"
      - agent: "qtc_audit_logger_agent"
        condition: "calling_agent_response.human_message == 'reject' or calling_agent_response.human_message == 'rejected' or calling_agent_response.human_message == 'hold' or calling_agent_response.human_message == 'held_for_review'"

  revops_lead_human:
    name: "revops_lead_human"
    agent_type: "human"
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 86400     # 24 hours
    description: "Accountable owner — resolves escalations (an RFQ still incomplete after rework, a severely overdue account); the Manager escalates errors here."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    yields:
      human_message: "string"        # resolved | held_for_review
    inputs:
      exception: "object"
    can_call:
      - agent: "qtc_audit_logger_agent"
        condition: always

  # ─────────────────────────────────────────────────────────────────────────
  # WORM audit sink — hash-chained, append-only, the terminus of every path.
  # Registered in main.py via sdk.intelligence("qtc_audit_logger_agent").
  # ─────────────────────────────────────────────────────────────────────────
  qtc_audit_logger_agent:
    name: "qtc_audit_logger_agent"
    agent_type: "external"
    framework: "custom"
    communication_type: "chain"
    description: "WORM audit — hash-chains every decision, approval, issuance, held gate, and dunning action. Terminus."
    connector_config:
      sink_type: "local_file"
      local_file_path: "./logs/qtc_audit.jsonl"
    yields:
      audit_event_id: "string"
      written_at_utc: "string"
      hash_chain_prev: "string"
      hash_chain_current: "string"
    inputs:
      session_id: "string"
      payload: "object"
    can_call: []
